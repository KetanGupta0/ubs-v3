<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -5.5 64 64" role="img" aria-label="Unboundbyte">
  <title>Unboundbyte</title>
  <defs>
    <linearGradient id="ubMark" x1="8" y1="58" x2="58" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset=".55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Bound: the solid arm and base of the U -->
  <path d="M16 8 L16 36 A16 16 0 0 0 48 36 L48 31"
        fill="none" stroke="url(#ubMark)" stroke-width="11" stroke-linecap="butt"/>
  <!-- Unbound: the right arm dissolving into ascending bytes -->
  <rect x="42.5" y="15" width="11" height="9" rx="1.5" fill="url(#ubMark)"/>
  <rect x="47" y="1" width="11" height="9" rx="1.5" fill="#06B6D4"/>
</svg>
