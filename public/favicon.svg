<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Unboundbyte">
  <title>Unboundbyte</title>
  <rect width="64" height="64" rx="14" fill="#0B1020"/>
  <defs>
    <linearGradient id="f" x1="8" y1="58" x2="58" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset=".55" stop-color="#818CF8"/>
